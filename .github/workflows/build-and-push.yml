name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - '*'      

jobs:
  build-and-release:
    runs-on: self-hosted-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # GOCACHE/GOMODCACHE already live on the runner's persistent shared /cache; setup-go's cache step only re-archives it (6-27 min on-prem).
          cache: false

      # goreleaser v2.17.1 is baked into the self-hosted-linux runner image
      # (SupportTools/ci-runners Dockerfile.arc2, taskforge-2671), so run it
      # directly instead of downloading it per job via goreleaser-action
      # (taskforge-2680, no job-time downloads).
      - name: Run GoReleaser
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          goreleaser --version
          goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build and push
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --cache-from supporttools/gokubebalancer:latest \
            -t supporttools/gokubebalancer:"${{ github.ref_name }}" \
            -t supporttools/gokubebalancer:latest \
            --push \
            -f Dockerfile .

      # The snap build that used to follow was removed: the self-hosted-linux
      # ARC runners have no snapd (`sudo: snap: command not found`), snapcraft
      # ships only as a snap, its output was never published or uploaded, and
      # its `sed -i ... snapcraft.yaml` targeted a root file that never existed
      # (the manifest is snap/snapcraft.yaml). Restore it on a snap-capable
      # runner if the snap is ever published.
